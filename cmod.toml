[package]
name = "spdlog"
version = "0.1.0"
edition = "2023"
authors = []

[module]
name = "com.github.cmod_ecosystem.spdlog"
root = "src/lib.cppm"

[dependencies]
"github.com/cmod-ecosystem/fmt" = { branch = "cmod-support" }

[dev-dependencies]

[build-dependencies]

[features]

[compat]
cpp = ">=20"
platforms = []

[toolchain]
compiler = "clang"
cxx_standard = "20"

[build]
type = "static-lib"
parallel = true
incremental = true
include_dirs = ["include"]
extra_flags = ["-DSPDLOG_COMPILED_LIB", "-DSPDLOG_FMT_EXTERNAL"]
sources = []
exclude = ["bundled_fmtlib_format.cpp"]

[target]

